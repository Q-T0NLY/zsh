# ============================================================================
# Docker Compose - Development Environment
# Complete stack for local development and testing
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # NEXUS Platform Application
  # ==========================================================================
  
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-platform
    hostname: nexus-dev
    restart: unless-stopped
    
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=nexus_dev
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_dev_pass
      
    volumes:
      - .:/opt/nexus
      - nexus-logs:/opt/nexus/logs
      - nexus-cache:/opt/nexus/cache
      - nexus-data:/opt/nexus/data
      
    ports:
      - "8000:8000"
      - "5000:5000"
      - "3000:3000"
      
    depends_on:
      - redis
      - postgres
      
    networks:
      - nexus-network
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  
  redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      
    volumes:
      - redis-data:/data
      
    ports:
      - "6379:6379"
      
    networks:
      - nexus-network
      
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    
    environment:
      - POSTGRES_DB=nexus_dev
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_dev_pass
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
      
    volumes:
      - postgres-data:/var/lib/postgresql/data
      
    ports:
      - "5432:5432"
      
    networks:
      - nexus-network
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      
    ports:
      - "9090:9090"
      
    networks:
      - nexus-network

  # ==========================================================================
  # Grafana - Monitoring Dashboards
  # ==========================================================================
  
  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    restart: unless-stopped
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      
    ports:
      - "3001:3000"
      
    depends_on:
      - prometheus
      
    networks:
      - nexus-network

# ============================================================================
# Networks
# ============================================================================

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes
# ============================================================================

volumes:
  nexus-logs:
    driver: local
  nexus-cache:
    driver: local
  nexus-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

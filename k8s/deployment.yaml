# ============================================================================
# Kubernetes Deployment for NEXUS Platform
# Production-grade deployment configuration
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-platform
  namespace: nexus
  labels:
    app: nexus
    component: platform
    version: v4.1.0
spec:
  replicas: 3
  revisionHistoryLimit: 10
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
      
  selector:
    matchLabels:
      app: nexus
      component: platform
      
  template:
    metadata:
      labels:
        app: nexus
        component: platform
        version: v4.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        
    spec:
      serviceAccountName: nexus-sa
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        
      # Init containers
      initContainers:
        - name: wait-for-redis
          image: busybox:1.35-glibc
          command: ['sh', '-c', 'until wget -q --spider http://redis:6379 2>/dev/null || echo "waiting for redis..."; do sleep 2; done']
          
      # Main container
      containers:
        - name: nexus
          image: nexus-platform:4.1.0
          imagePullPolicy: IfNotPresent
          
          # Security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
                
          # Ports
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: dashboard
              containerPort: 5000
              protocol: TCP
              
          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            
          # Resources
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-platform
  namespace: nexus
spec:
  type: ClusterIP
  selector:
    app: nexus
    component: platform
  ports:
    - name: http
      port: 8000
      targetPort: http
